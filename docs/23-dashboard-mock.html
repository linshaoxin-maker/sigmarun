<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sigmarun dashboard · 设计稿 v0.2</title>
<style>
/* ============ tokens(docs/23 §8;明暗为同族色相两组明度,均经校验器验证) ============ */
:root{
  --bg:#f6f8f7; --card:#ffffff; --line:#e2e9e6; --line-soft:#edf2f0;
  --ink:#15211f; --ink2:#4d5c58; --mut:#8a9995;
  --acc:#0f6e56; --acc-tint:rgba(15,110,86,.10);
  --st-draft:#888780; --st-ready:#ba7517; --st-work:#15559c; --st-review:#9b4fd0;
  --st-approved:#1d9e75; --st-done:#0f6e56; --st-alert:#a32d2d; --st-cancel:#5f5e5a;
  --shadow:0 8px 28px rgba(21,33,31,.13);
  --edge:#9aa8a4;
}
html[data-theme="dark"]{
  --bg:#0d1413; --card:#151f1d; --line:#26322f; --line-soft:#1c2725;
  --ink:#e7eeec; --ink2:#9fb0ab; --mut:#6b7b76;
  --acc:#5dcaa5; --acc-tint:rgba(93,202,165,.13);
  --st-draft:#98978f; --st-ready:#d68a28; --st-work:#4a90dd; --st-review:#c793f5;
  --st-approved:#52d49a; --st-done:#1f8a66; --st-alert:#f28b82; --st-cancel:#7d7c75;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --edge:#4e5c58;
}
@media(prefers-color-scheme:dark){
  html:not([data-theme]){
    --bg:#0d1413; --card:#151f1d; --line:#26322f; --line-soft:#1c2725;
    --ink:#e7eeec; --ink2:#9fb0ab; --mut:#6b7b76;
    --acc:#5dcaa5; --acc-tint:rgba(93,202,165,.13);
    --st-draft:#98978f; --st-ready:#d68a28; --st-work:#4a90dd; --st-review:#c793f5;
    --st-approved:#52d49a; --st-done:#1f8a66; --st-alert:#f28b82; --st-cancel:#7d7c75;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --edge:#4e5c58;
  }
}
/* ============ base ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-width:1200px;font:13px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ ① 顶栏 ============ */
#top{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--card);position:relative;z-index:30}
#top .brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.badge-ro{font-size:11px;color:var(--acc);background:var(--acc-tint);border:1px solid transparent;
  padding:1px 8px;border-radius:99px;font-weight:600}
.badge-mock{font-size:11px;color:var(--st-ready);background:color-mix(in srgb,var(--st-ready) 12%,transparent);
  padding:1px 8px;border-radius:99px;font-weight:600}
#top .root{color:var(--mut);font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .sp{flex:1}
#needsBtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;
  padding:5px 12px;font-weight:600;font-size:12.5px;background:var(--card)}
#needsBtn:hover{border-color:var(--mut)}
#needsBtn .n{background:var(--st-alert);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;
  text-align:center;border-radius:9px;padding:0 5px;font-weight:700}
html[data-theme="dark"] #needsBtn .n{color:#161311}
.meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--st-approved);animation:pu 2.5s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
#themeBtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink2)}
#themeBtn:hover{border-color:var(--mut)}

/* ============ ② 收件箱面板 ============ */
#inbox{position:absolute;top:52px;right:12px;width:440px;max-height:calc(100vh - 70px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;
  display:none}
#inbox.open{display:block}
#inbox .hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--card);z-index:1}
#inbox .hd b{font-size:13px}
#inbox .hd .sub{color:var(--mut);font-size:11px}
#inbox .hd .x{margin-left:auto;color:var(--mut);font-size:15px;padding:2px 6px;border-radius:6px}
#inbox .hd .x:hover{background:var(--line-soft)}
.ni{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:default}
.ni:last-child{border-bottom:none}
.ni .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex:none;margin-top:1px}
.ni .bd{min-width:0;flex:1}
.ni .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ni .kind{font-weight:650;font-size:12.5px}
.chip{font-size:10.5px;padding:0 6px;border-radius:5px;background:var(--line-soft);color:var(--ink2);
  border:1px solid var(--line);white-space:nowrap}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--acc);color:var(--acc)}
.ni .dt{color:var(--ink2);font-size:12px;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.cmd{display:flex;align-items:center;gap:6px;background:var(--line-soft);border:1px solid var(--line);
  border-radius:7px;padding:4px 8px}
.cmd code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink2);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.copy{font-size:11px;color:var(--acc);font-weight:600;flex:none;padding:1px 6px;border-radius:5px}
.copy:hover{background:var(--acc-tint)}

/* ============ 三栏骨架 ============ */
#grid{display:grid;grid-template-columns:248px minmax(520px,1fr) 360px;
  height:calc(100vh - 48px);overflow:hidden}
.col{overflow-y:auto;padding:12px}
#colL{border-right:1px solid var(--line)}
#colR{border-left:1px solid var(--line);padding:0}
h4{margin:2px 2px 8px;font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.07em}

/* ============ ③ run 卡 ============ */
.runcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px 10px 14px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.runcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--band)}
.runcard:hover{border-color:var(--mut)}
.runcard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.runcard .l1{display:flex;align-items:baseline;gap:6px}
.runcard .rid{font-size:11.5px;color:var(--ink2)}
.runcard .lw{font-size:10px;color:var(--mut)}
.runcard .pct{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2)}
.runcard .tt{font-weight:650;font-size:12.5px;margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runcard .stt{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.stack{display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden;margin-top:7px;background:var(--line-soft)}
.stack i{display:block;height:100%}

/* ============ ④ agent 卡 ============ */
.agsum{color:var(--mut);font-size:11.5px;margin:0 2px 8px}
.ag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.ag.stale{opacity:.62}
.ag .l1{display:flex;align-items:center;gap:6px}
.ag .id{font-weight:650;font-size:12px}
.ag .tool{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ag .role{margin-left:auto;font-size:10.5px;color:var(--ink2)}
.ag .l2{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--ink2)}
.hb{width:7px;height:7px;border-radius:50%;background:var(--st-approved);flex:none}
.hb.warn{background:var(--st-ready)}
.ag .hbt{color:var(--mut);font-size:11px;margin-left:auto}

/* ============ ⑤ 中栏 ============ */
#paneHd{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;flex-wrap:wrap}
#paneHd .tt{font-size:15px;font-weight:700}
#paneHd .big{font-size:20px;font-weight:700;color:var(--acc)}
#paneHd .wt{color:var(--mut);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;
  font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);white-space:nowrap}
.tabs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{padding:4px 12px;font-size:12px;color:var(--ink2);background:var(--card)}
.tabs button.on{background:var(--acc-tint);color:var(--acc);font-weight:650}
#legend{display:flex;gap:12px;align-items:center;color:var(--mut);font-size:11px;padding:0 2px 8px}
#legend svg{vertical-align:-2px}
#dagwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative}
#dagwrap svg{display:block}
.node{cursor:pointer}
.node rect.bx{fill:color-mix(in srgb,var(--c) 11%,var(--card));stroke:var(--c);stroke-width:1.4;rx:9}
.node.dim rect.bx{stroke-dasharray:4 3;fill:var(--card)}
.node.dim{opacity:.75}
.node.sel rect.bx{stroke:var(--acc);stroke-width:2.2;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--acc) 45%,transparent))}
.node text{font-family:ui-monospace,Menlo,monospace}
.node .nid{font-size:11px;font-weight:700;fill:var(--c)}
.node .nti{font-size:11px;fill:var(--ink2);font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.node .now{font-size:9.5px;fill:var(--mut)}
.node.cancel .nti{text-decoration:line-through}
.node.working rect.bx{animation:npulse 2.5s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.fade{opacity:.18;transition:opacity .15s}
g.edge{cursor:pointer}
g.edge.esel path.vis{stroke-width:2.6}
.rk{font-size:10px}
.lgchip{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;
  padding:2px 10px;margin-left:auto}
.lgchip.on{color:var(--acc);border-color:var(--acc);background:var(--acc-tint)}
.lgchip+.lgchip{margin-left:6px}
/* 任务表 */
#tbl{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#tbl table{width:100%;border-collapse:collapse;font-size:12px}
#tbl th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;background:var(--line-soft)}
#tbl td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
#tbl td:first-child{white-space:nowrap}
#tbl tr:last-child td{border-bottom:none}
#tbl tbody tr{cursor:pointer}
#tbl tbody tr:hover{background:var(--line-soft)}
#tbl tbody tr.sel{background:var(--acc-tint)}
.depchip{font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);
  margin-right:3px;white-space:nowrap;cursor:pointer}
.depchip.unmet{border-color:color-mix(in srgb,var(--st-ready) 55%,transparent);color:var(--st-ready)}
.depchip:hover{border-color:var(--acc);color:var(--acc)}

/* ============ ⑥ 侧栏 ============ */
#colR .inner{padding:12px}
#sbHead{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
#sbHead .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#sbHead .tid{font-weight:700;font-size:13.5px}
#sbHead .ty{font-size:10.5px;color:var(--mut);border:1px solid var(--line);padding:0 5px;border-radius:4px}
#sbHead .tt{font-size:13px;font-weight:600;margin-top:5px}
#sbHead .own{color:var(--mut);font-size:11.5px;margin-top:4px}
.sec{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.sec h5{margin:0 0 8px;font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.07em}
.kv{display:flex;gap:8px;font-size:12px;margin:4px 0;align-items:baseline}
.kv b{color:var(--mut);font-weight:600;flex:none;width:58px;font-size:11.5px}
.kv .v{color:var(--ink);min-width:0}
.riskline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--st-alert);margin:4px 0}
.riskline.warn{color:var(--st-ready)}
.ck{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.ck code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink2);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ckpill{font-size:10.5px;font-weight:700;padding:0 7px;border-radius:99px;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent)}
.cf{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0;color:var(--ink2)}
.cf code{font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oob{font-size:9.5px;color:var(--st-ready);border:1px solid color-mix(in srgb,var(--st-ready) 50%,transparent);
  border-radius:4px;padding:0 4px;flex:none}
.sum{font-size:12px;color:var(--ink2);margin-top:6px}
/* 评审轮次 / 验证 / 重试 / 消息 */
.rev{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0;font-size:12px}
.rev .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rev .rid{font-weight:650}
.rev .when{color:var(--mut);font-size:10.5px;margin-left:auto}
.find{display:flex;gap:6px;align-items:baseline;margin-top:5px;font-size:11.5px;color:var(--ink2)}
.find .mf{flex:none;font-size:9.5px;font-weight:700;color:var(--st-alert);
  border:1px solid color-mix(in srgb,var(--st-alert) 50%,transparent);border-radius:4px;padding:0 4px}
.find .ok{color:var(--st-approved);border-color:color-mix(in srgb,var(--st-approved) 50%,transparent)}
.att{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink2);margin:5px 0}
.att .no{flex:none;font-weight:700;color:var(--st-ready)}
.msgc{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 7%,transparent);
  border-radius:0 8px 8px 0;padding:7px 10px;margin:6px 0;font-size:12px}
.msgc .l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.msgc .ty2{font-weight:650;color:var(--c);font-size:11.5px}
.msgc .bd2{color:var(--ink2)}
/* 边详情卡 */
.edgehead{padding:12px 14px;border-bottom:1px solid var(--line)}
.edgehead .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.earrow{color:var(--mut);font-size:14px}
.refline{display:flex;gap:6px;align-items:center;font-size:11px;padding:2px 0;color:var(--ink2)}
.refline code{font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 时间线 */
.tl{position:relative;margin-left:4px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 12px 22px}
.ev:last-child{padding-bottom:2px}
.ev .pt{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--c);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--c)}
.ev .l1{display:flex;align-items:center;gap:6px;font-size:12px}
.ev .nm{font-weight:650}
.ev .meta2{color:var(--mut);font-size:10.5px;margin-top:2px}
.ev .pay{color:var(--ink2);font-size:11px;margin-top:2px}
.more{color:var(--mut);font-size:11px;margin-top:8px}
.empty{color:var(--mut);font-size:12px;padding:24px 14px;text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);
  font-size:12px;padding:6px 14px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;z-index:99}
#toast.on{opacity:.93;transform:translate(-50%,0)}
</style>
</head>
<body>

<header id="top">
  <span class="brand">sigmarun</span>
  <span class="badge-ro">只读</span>
  <span class="badge-mock" title="设计稿:内嵌假数据,不连真实 .team/">设计稿 · 假数据</span>
  <span class="root mono" title="~/work/acme-api/.team">~/work/acme-api/.team</span>
  <span class="sp"></span>
  <button id="needsBtn" onclick="toggleInbox()">需要你 <span class="n" id="needsN">4</span></button>
  <span class="meta mono" id="stamp">12:07:31 · seq 214</span>
  <span class="meta"><span class="pulse"></span>2.5s 轮询 · 实时</span>
  <button id="themeBtn" onclick="cycleTheme()">主题:自动</button>
  <div id="inbox" class="open">
    <div class="hd"><b>需要你处理</b><span class="sub">4 件 · 跨 2 个需求 · 命令只可复制</span>
      <button class="x" onclick="toggleInbox()">✕</button></div>
    <div id="inboxList"></div>
  </div>
</header>

<div id="grid">
  <!-- ③④ 左栏 -->
  <div class="col" id="colL">
    <h4>需求 · 3</h4>
    <div id="runs"></div>
    <h4 style="margin-top:16px">窗口 · agents</h4>
    <div class="agsum" id="agsum"></div>
    <div id="agents"></div>
  </div>

  <!-- ⑤ 中栏 -->
  <div class="col" id="colM">
    <div id="paneHd"></div>
    <div id="legend">
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--edge)" stroke-width="1.6"/></svg> blocks</span>
      <span style="color:var(--st-ready)"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--st-ready)" stroke-width="1.6"/></svg> blocks·未满足</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--st-review)" stroke-width="1.6" stroke-dasharray="6 4"/></svg> 产出 context</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--edge)" stroke-width="1.6" stroke-dasharray="2 4"/></svg> 软依赖</span>
      <span style="color:var(--mut)">· 点节点看任务,点边看关系</span>
      <button class="lgchip" id="foldChip" onclick="collapseDone=!collapseDone;renderAll()">折叠完成组</button>
    </div>
    <div id="dagwrap"><svg id="dag"></svg></div>
    <div id="tbl">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)">
        <span style="font-size:11px;color:var(--mut)" id="tblcount"></span>
        <button class="lgchip" id="hideChip" onclick="hideClosed=!hideClosed;renderAll()">隐藏已收尾</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>类型</th><th>状态</th><th>owner</th><th>依赖</th><th>风险</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ⑥ 右栏 -->
  <div class="col" id="colR"><div id="sidebar"></div></div>
</div>
<div id="toast">已复制</div>

<script>
/* ================= 假数据(字段名与 /api/state 真实 envelope 一致,docs/23 §3) ================= */
const MOCK = {
  generated_at: '2026-07-24T12:07:31',
  runs: [
    {
      run: { run_id:'RUN-0007', title:'重构 evidence 校验管道', status:'active', mode:'feature',

  task_blocked:'blocked', task_unblocked:'working', verification_passed:'verified',
  task_integrated:'integrated', task_cancelled:'cancelled', task_done:'done'
};
const TOOL_SHORT = { 'claude-code':'CC', 'codex':'CX' };

/* ================= 状态 ================= */
let selRun = 'RUN-0007';
let selTask = 'TASK-0004';
let selEdge = null;          // 与 selTask 互斥:选边看关系,选节点看任务
let tab = 'dag';
let collapseDone = false;    // DAG 完成组折叠
let hideClosed = false;      // 任务表隐藏已收尾
const FOLD = new Set(['done','integrated','cancelled']);
let LAST_DAG = { nodes:[], edges:[] };   // 折叠后的展示图,hover 邻接用

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const curRun = () => MOCK.runs.find(r => r.run.run_id === selRun);
function selectNode(id){ selTask = id; selEdge = null; renderAll(); }
function selectEdge(id){ selEdge = id; renderAll(); }
/* hover 邻接高亮:非邻接的节点与边淡出(只操作 class,不重渲染) */
function hov(id){
  const svg = document.getElementById('dag');
  if (!id){ svg.querySelectorAll('.fade').forEach(e => e.classList.remove('fade')); return; }
  const keep = new Set([id]);
  LAST_DAG.edges.forEach((e,i) => {
    if (e.from === id || e.to === id){ keep.add(e.from); keep.add(e.to); keep.add(e.edge_id || 'E'+i); }
  });
  svg.querySelectorAll('g.node').forEach(g => g.classList.toggle('fade', !keep.has(g.dataset.nid)));
  svg.querySelectorAll('g.edge').forEach(g => g.classList.toggle('fade', !keep.has(g.dataset.eid)));
}

/* ================= ⑤ DAG(blocks 拓扑分层,与 dashboard.ts 同思路) ================= */
const NW = 142, NH = 52, HG = 32, VG = 16, PAD = 16;
function renderDag(){
  const r = curRun();
  document.getElementById('foldChip')?.classList.toggle('on', collapseDone);
  let nodes = (r.graph.nodes || []).slice(), edges = (r.graph.edges || []).slice();
  /* 完成组折叠:done/integrated/cancelled 收进一个聚合节点(历史不删除,只收纳) */
  if (collapseDone && nodes.some(n => FOLD.has(n.status))){
    const folded = nodes.filter(n => FOLD.has(n.status));
    const fid = new Set(folded.map(n => n.task_id));
    nodes = nodes.filter(n => !fid.has(n.task_id));
    nodes.unshift({ task_id:'__agg', title:`点击展开 ${folded.length} 个`, status:'agg' });
    const seen = new Set();
    edges = edges.flatMap(e => {
      const from = fid.has(e.from) ? '__agg' : e.from;
      if (fid.has(e.to)) return [];
      if (from === '__agg'){ const k = e.kind + '>' + e.to; if (seen.has(k)) return []; seen.add(k); }
      return [{ ...e, from }];
    });
    if (selEdge && !edges.some(e => e.edge_id === selEdge)) selEdge = null;
  }
  const svg = document.getElementById('dag');
  if (!nodes.length){ svg.setAttribute('height', 60);
    svg.innerHTML = '<text x="16" y="34" fill="var(--mut)" font-size="12">此需求没有任务图(轻量模式或已收尾)</text>'; return; }
  const statusOf = {}; (r.graph.nodes || []).forEach(n => statusOf[n.task_id] = n.status);
  LAST_DAG = { nodes, edges };
  /* 分层:只按 blocks 边 */
  const depth = {}; nodes.forEach(n => depth[n.task_id] = 0);
  const be = edges.filter(e => e.kind === 'blocks');
  for (let i = 0; i < nodes.length; i++)
    be.forEach(e => { if (depth[e.to] < depth[e.from] + 1) depth[e.to] = depth[e.from] + 1; });
  const cols = {};
  nodes.slice().sort((a,b)=>a.task_id<b.task_id?-1:1).forEach(n => (cols[depth[n.task_id]] ||= []).push(n));
  const pos = {}; let maxRow = 1;
  Object.keys(cols).sort((a,b)=>a-b).forEach(d => {
    cols[d].forEach((n,i) => pos[n.task_id] = { x: PAD + d*(NW+HG), y: PAD + i*(NH+VG) });
    maxRow = Math.max(maxRow, cols[d].length);
  });
  const W = PAD*2 + (Math.max(...Object.keys(cols).map(Number))+1)*(NW+HG) - HG;
  const H = PAD*2 + maxRow*(NH+VG) - VG;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  let s = `<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--st-ready)"/></marker>
  </defs>`;
  /* 边:blocks(实线;未满足=琥珀+微标) / produces_context_for(短划+refs 徽标) / soft(点线) */
  const met = st => st === 'done' || st === 'integrated';
  edges.forEach((e, i) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    const eid = e.edge_id || 'E' + i;
    const x1 = a.x + NW, y1 = a.y + NH/2, x2 = b.x, y2 = b.y + NH/2;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const d = `M${x1} ${y1} C${x1+HG*.55} ${y1},${x2-HG*.55} ${y2},${x2} ${y2}`;
    let vis = '';
    if (e.kind === 'blocks'){
      const ok = e.from === '__agg' ? true : met(statusOf[e.from]);
      vis = `<path class="vis" d="${d}" fill="none" stroke="${ok?'var(--edge)':'var(--st-ready)'}" stroke-width="1.6"
              marker-end="url(#${ok?'ar':'arw'})"${ok?'':' opacity="0.95"'}/>`;
      if (!ok) vis += `<rect x="${mx-19}" y="${my-8}" width="38" height="15" rx="7.5"
              fill="color-mix(in srgb,var(--st-ready) 14%,var(--card))" stroke="var(--st-ready)" stroke-width="0.8"/>
            <text x="${mx}" y="${my+3}" text-anchor="middle" font-size="9" fill="var(--st-ready)">等上游</text>`;
    } else if (e.kind === 'produces_context_for'){
      vis = `<path class="vis" d="${d}" fill="none" stroke="var(--st-review)" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.75"/>`;
      if (e.refs) vis += `<circle cx="${mx}" cy="${my}" r="8" fill="color-mix(in srgb,var(--st-review) 15%,var(--card))"
              stroke="var(--st-review)" stroke-width="0.9"/>
            <text x="${mx}" y="${my+3}" text-anchor="middle" font-size="9" fill="var(--st-review)">${e.refs}</text>`;
    } else {
      vis = `<path class="vis" d="${d}" fill="none" stroke="var(--edge)" stroke-width="1.3" stroke-dasharray="2 4" opacity="0.6"/>`;
    }
    /* 透明宽命中层让细边可点;点边 → 侧栏关系卡 */
    s += `<g class="edge${selEdge===eid?' esel':''}" data-eid="${eid}" onclick="selectEdge('${eid}')">
      ${vis}<path d="${d}" fill="none" stroke="transparent" stroke-width="11" pointer-events="stroke"/></g>`;
  });
  /* 节点 */
  const riskOf = {};
  (r.status.risks||[]).forEach(k => { if (k.task_id) (riskOf[k.task_id] ||= []).push(k); });
  /* 重试角标数据:previous_attempts 折进风险(表格同源) */
  nodes.forEach(n => {
    const at = DETAIL[n.task_id]?.task?.previous_attempts?.length;
    if (at) (riskOf[n.task_id] ||= []).push({ kind:'retry', n: at });
  });
  nodes.forEach(n => {
    const p = pos[n.task_id], st = ST[n.status] || ST.unknown;
    const isAgg = n.task_id === '__agg';
    const cls = ['node']; if (n.status==='draft') cls.push('dim');
    if (n.status==='cancelled') cls.push('cancel'); if (n.task_id===selTask) cls.push('sel');
    if (n.status==='claimed'||n.status==='working') cls.push('working');
    const t = r.tasks.find(t=>t.task_id===n.task_id) || {};
    const click = isAgg ? 'collapseDone=false;renderAll()' : `selectNode('${n.task_id}')`;
    s += `<g class="${cls.join(' ')}" style="--c:${st.c}" data-nid="${n.task_id}" onclick="${click}"
        onmouseenter="hov('${n.task_id}')" onmouseleave="hov(null)">
      <rect class="bx" x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9"${isAgg?' stroke-dasharray="5 4"':''}/>
      <text class="nid" x="${p.x+10}" y="${p.y+19}">${st.g} ${isAgg?'已收尾组':n.task_id.replace('TASK-','T')}</text>
      <text class="nti" x="${p.x+10}" y="${p.y+37}">${esc(n.title.length>10?n.title.slice(0,9)+'…':n.title)}</text>`;
    if (t.owner_agent_id)
      s += `<text class="now" x="${p.x+NW-8}" y="${p.y+19}" text-anchor="end">${t.owner_agent_id}</text>`;
    const rk = riskOf[n.task_id];
    if (rk && !isAgg){
      const isAlert = rk.some(k=>k.kind==='unresolved_blocker');
      const col = isAlert ? 'var(--st-alert)' : 'var(--st-ready)';
      const icon = isAlert ? '⛔' : rk.some(k=>k.kind==='stale_lease') ? '⏱' : '↻';
      const tip = rk.map(k => k.kind==='stale_lease' ? `租约超时 ${k.minutes_overdue} 分钟`
        : k.kind==='retry' ? `重试第 ${k.n+1} 次(有 previous_attempts)` : k.kind).join(' / ');
      s += `<g><title>${tip}</title><circle cx="${p.x+NW-2}" cy="${p.y+2}" r="8.5"
          fill="color-mix(in srgb,${col} 16%,var(--card))" stroke="${col}" stroke-width="1"/>
        <text class="rk" x="${p.x+NW-2}" y="${p.y+5.5}" text-anchor="middle" fill="${col}">${rk.length>1?rk.length:icon}</text></g>`;
    }
    s += '</g>';
  });
  svg.innerHTML = s;
}

/* ================= ⑤ 任务表 ================= */
function renderTable(){
  const r = curRun();
  const statusOf = {}; (r.tasks||[]).forEach(t => statusOf[t.task_id] = t.status);
  const riskOf = {};
  (r.status.risks||[]).forEach(k => { if (k.task_id) (riskOf[k.task_id] ||= []).push(k); });
  const order = ['blocked','changes_requested','reviewing','submitted','working','claimed','approved','ready','draft','verified','integrated','done','cancelled'];
  let rows = (r.tasks||[]).slice().sort((a,b) =>
    (order.indexOf(a.status)-order.indexOf(b.status)) || (a.task_id<b.task_id?-1:1));
  const total = rows.length;
  if (hideClosed) rows = rows.filter(t => !FOLD.has(t.status));
  document.getElementById('hideChip').classList.toggle('on', hideClosed);
  document.getElementById('tblcount').textContent =
    hideClosed ? `${rows.length}/${total} 项(已收尾折叠 —— 历史不删除,账本可回放)` : `${total} 项`;
  document.getElementById('tbody').innerHTML = rows.map(t => {
    const st = ST[t.status] || ST.unknown;
    const deps = (t.depends_on||[]).map(d => {
      const unmet = !(statusOf[d]==='done'||statusOf[d]==='integrated');
      return `<span class="depchip${unmet?' unmet':''}" title="${unmet?'上游未完成':'上游已完成'}"
        onclick="event.stopPropagation();selTask='${d}';renderAll()">${d.replace('TASK-','T')}</span>`;
    }).join('') || '<span style="color:var(--mut)">—</span>';
    const attempts = DETAIL[t.task_id]?.task?.previous_attempts?.length || 0;
    const rk = ((riskOf[t.task_id]||[]).map(k =>
      k.kind==='stale_lease' ? `<span title="租约超时 ${k.minutes_overdue} 分钟">⏱ ${k.minutes_overdue}m</span>`
      : k.kind==='unresolved_blocker' ? `<span title="阻塞未答">⛔</span>` : '').join(' ')
      + (attempts ? ` <span title="第 ${attempts+1} 次尝试,previous_attempts 见侧栏">↻${attempts}</span>` : ''))
      .trim() || '<span style="color:var(--mut)">—</span>';
    return `<tr class="${t.task_id===selTask?'sel':''}" onclick="selectNode('${t.task_id}')">
      <td class="mono" style="font-size:11px">${t.task_id}</td>
      <td style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</td>
      <td style="color:var(--mut);font-size:11px">${t.type||'—'}</td>
      <td><span class="pill" style="--c:${st.c}">${st.g} ${st.zh}</span></td>
      <td class="mono" style="font-size:11px">${t.owner_agent_id||'—'}</td>
      <td>${deps}</td>
      <td style="color:var(--st-ready)">${rk}</td>
    </tr>`;
  }).join('');
}

/* ================= ⑥ 侧栏 ================= */
function renderSidebar(){
  const r = curRun();
  const el = document.getElementById('sidebar');
  if (selEdge){
    const e = (r.graph.edges||[]).find(x => x.edge_id === selEdge);
    if (e){ renderEdgeCard(el, r, e); return; }
    selEdge = null;
  }
  const t = (r.tasks||[]).find(t => t.task_id === selTask);
  if (!t){
    const u = r.run.user_state || {};
    el.innerHTML = `<div class="empty" style="padding-top:60px">点击 DAG 节点或任务行查看详情<br><br>
      <span style="font-size:11px">${esc(u.detail||'')}</span></div>`;
    return;
  }
  const st = ST[t.status] || ST.unknown;
  const d = DETAIL[t.task_id] || {
    task:{ goal:'(设计稿:此任务未内嵌详情假数据;实现中由 /api/task 懒加载)', acceptance:[],
      paths:{ allow:[], requires_approval:[] }, weight:1, previous_attempts:[] },
    claim: t.owner_agent_id ? { owner:t.owner_agent_id, line:'claim active', gate:null } : null,
    evidence:null,
    events:[ { seq:128, ts:'09:40:22', event:'task_published', actor:'user', pay:'' },
             { seq:121, ts:'09:31:07', event:'task_created', actor:'user', pay:'' } ],
    total:2
  };
  const risks = (r.status.risks||[]).filter(k => k.task_id === t.task_id);
  const html = [];
  /* 头部 */
  html.push(`<div id="sbHead">
    <div class="l1"><span class="tid mono">${t.task_id}</span>
      <span class="pill" style="--c:${st.c}">${st.g} ${st.zh}</span>
      <span class="ty">${t.type||'—'}</span></div>
    <div class="tt">${esc(t.title)}</div>
    <div class="own">owner <span class="mono">${t.owner_agent_id||'—'}</span>
      ${d.claim?` · ${esc(d.claim.line)}`:''}${d.claim&&d.claim.gate?` · ${esc(d.claim.gate)}`:''}</div>
  </div>`);
  /* A 档案 */
  const deps = (t.depends_on||[]).map(dd => {
    const ds = (r.tasks.find(x=>x.task_id===dd)||{}).status;
    const unmet = !(ds==='done'||ds==='integrated');
    return `<span class="depchip${unmet?' unmet':''}" onclick="selTask='${dd}';renderAll()">${dd}${unmet?' ·等':''}</span>`;
  }).join('') || '<span style="color:var(--mut)">无</span>';
  html.push(`<div class="sec"><h5>任务档案</h5>
    <div class="kv"><b>目标</b><div class="v">${esc(d.task.goal)}</div></div>
    ${d.task.acceptance.length?`<div class="kv"><b>验收</b><div class="v">${d.task.acceptance.map(a=>`· ${esc(a)}`).join('<br>')}</div></div>`:''}
    <div class="kv"><b>依赖</b><div class="v">${deps}</div></div>
    <div class="kv"><b>路径</b><div class="v mono" style="font-size:11px">${
      d.task.paths.allow.map(p=>esc(p)).join('<br>')||'—'}${
      d.task.paths.requires_approval.length?`<br><span style="color:var(--st-ready)">待批准: ${d.task.paths.requires_approval.map(esc).join(', ')}</span>`:''}</div></div>
    <div class="kv"><b>权重</b><div class="v">${d.task.weight}</div></div>
    ${risks.map(k => k.kind==='stale_lease'
      ? `<div class="riskline warn">⏱ 租约超时 ${k.minutes_overdue} 分钟(${k.agent_id})—— 收件箱有回收命令</div>`
      : k.kind==='unresolved_blocker'
      ? `<div class="riskline">⛔ 阻塞未答(${k.message_id})—— 见收件箱</div>` : '').join('')}
  </div>`);
  /* B evidence */
  if (d.evidence){
    const ev = d.evidence;
    const pass = ev.checks.filter(c=>c.status==='pass').length;
    html.push(`<div class="sec"><h5>Evidence · 第 ${ev.revision} 版${ev.history?`(${ev.history} 次归档)`:''}</h5>
      <div style="font-size:12px;color:var(--ink2);margin-bottom:6px">checks ${pass}/${ev.checks.length} 通过</div>
      ${ev.checks.map(c => `<div class="ck"><code>${esc(c.name)}</code>
        <span class="ckpill" style="--c:${c.status==='pass'?'var(--st-approved)':'var(--st-alert)'}">${c.status==='pass'?'✓ pass':'✗ fail'}</span></div>`).join('')}
      <div style="font-size:11.5px;color:var(--mut);margin:8px 0 3px">改动文件 · ${ev.changed_files.length}</div>
      ${ev.changed_files.map(f => `<div class="cf"><code title="${esc(f.path)}">${esc(f.path)}</code>${f.in_scope?'':'<span class="oob">越界</span>'}</div>`).join('')}
      <div class="sum">${esc(ev.summary)}</div>
    </div>`);
  } else {
    html.push(`<div class="sec"><h5>Evidence</h5><div style="color:var(--mut);font-size:12px">尚未提交</div></div>`);
  }
  /* C 评审轮次(reviews/TASK-ID/REVIEW-*-NN.json;失败→返工的完整回路) */
  const inReview = t.status === 'reviewing' || t.status === 'submitted';
  if ((d.reviews && d.reviews.length) || inReview){
    const n0 = (d.reviews||[]).length;
    const cards = (d.reviews||[]).map(rv => {
      const dz = DECISION_ZH[rv.decision] || [rv.decision,'var(--st-draft)'];
      return `<div class="rev"><div class="l1"><span class="rid mono">${rv.review_id}</span>
          <span class="ckpill" style="--c:${dz[1]}">${dz[0]}</span>
          <span class="chip">评审人 ${rv.reviewer_agent_id}</span>
          <span class="chip">evidence 第 ${rv.evidence_revision} 版</span>
          <span class="when">${rv.completed_at}</span></div>
        ${(rv.findings||[]).map(f => `<div class="find"><span class="mf${f.severity==='must_fix'?'':' ok'}">${f.severity==='must_fix'?'must_fix':'建议'}</span>
          <span>${esc(f.message)}${f.message_ref?` <span class="chip mono">${f.message_ref}</span>`:''}</span></div>`).join('')}
        ${rv.scope_check && rv.scope_check.out_of_scope_files.length ? `<div class="find"><span class="mf">越界</span>
          <span class="mono" style="font-size:11px">${rv.scope_check.out_of_scope_files.map(esc).join(', ')}</span></div>` : ''}
      </div>`;
    }).join('');
    html.push(`<div class="sec"><h5>评审轮次 · ${n0}</h5>${cards}
      ${t.status==='reviewing' ? `<div style="font-size:11.5px;color:var(--st-review);margin-top:4px">◐ 第 ${n0+1} 轮评审进行中 · ${esc((d.claim&&d.claim.gate)||'')}</div>`
        : t.status==='submitted' ? `<div style="font-size:11.5px;color:var(--st-review);margin-top:4px">◐ 已提交,等第 ${n0+1} 轮评审认领</div>` : ''}</div>`);
  }
  /* D 验证记录(verification/VERIFY-*.json) */
  if (d.verify !== undefined && d.verify !== null){
    if (d.verify === 'pending'){
      html.push(`<div class="sec"><h5>验证</h5><div class="riskline warn">◑ 等独立验证 —— 认领命令在收件箱</div></div>`);
    } else {
      const v = d.verify;
      html.push(`<div class="sec"><h5>验证 · ${v.verify_id}</h5><div class="rev">
        <div class="l1"><span class="ckpill" style="--c:${v.verdict==='pass'?'var(--st-done)':'var(--st-alert)'}">${v.verdict==='pass'?'✓ 通过':'✗ 未过'}</span>
          <span class="chip">验证人 ${v.verifier_agent_id}</span><span class="when">${v.executed_at}</span></div>
        ${v.checks.map(c => `<div class="ck"><code>${esc(c.name)}</code>
          <span style="font-size:10.5px;color:var(--mut)">exit ${c.exit_code}</span>
          <span class="ckpill" style="--c:${c.status==='pass'?'var(--st-approved)':'var(--st-alert)'}">${c.status}</span></div>`).join('')}
        ${v.failures_mapped && v.failures_mapped.length ? `<div class="find"><span class="mf">映射</span><span>${v.failures_mapped.map(esc).join('; ')}</span></div>` : ''}
      </div></div>`);
    }
  }
  /* E 重试档案(task.previous_attempts,reclaim/release 落笔;worktree 遗留可见) */
  if (d.task.previous_attempts && d.task.previous_attempts.length){
    html.push(`<div class="sec"><h5>重试档案 · ${d.task.previous_attempts.length} 次前尝试</h5>
      ${d.task.previous_attempts.map(a => `<div class="att"><span class="no">↻${a.attempt}</span>
        <span><span class="mono">${a.agent_id}</span> 的租约被回收(${a.reclaim_reason==='lease_expired_sweep'?'超时清扫':esc(a.reclaim_reason)})· ${a.ended_at}
        ${a.branch?`<br>遗留分支 <span class="mono" style="font-size:10.5px">${a.branch}</span> · worktree 已弃 ——
          <button class="copy" onclick="copyText(this,'git worktree remove ${a.worktree_path} --force')">复制清理命令</button>`:''}</span></div>`).join('')}
    </div>`);
  }
  /* F 消息线程(context/messages.jsonl 按 task 过滤) */
  if (d.messages && d.messages.length){
    html.push(`<div class="sec"><h5>消息</h5>
      ${d.messages.map(m => {
        const mc = (m.type==='blocker'||m.type==='request_changes') ? 'var(--st-alert)' : m.type==='answer' ? 'var(--st-approved)' : 'var(--st-ready)';
        return `<div class="msgc" style="--c:${mc}"><div class="l1"><span class="ty2">${m.type}</span>
          <span class="chip mono">${m.message_id}</span><span class="chip">来自 ${m.from}</span>
          ${m.status==='open' ? `<span style="font-size:10.5px;color:var(--st-alert)">未答 · 挂了 ${m.age}</span>` : `<span style="font-size:10.5px;color:var(--st-approved)">已答</span>`}</div>
          <div class="bd2">${esc(m.body)}</div></div>`;}).join('')}
    </div>`);
  }
  /* G 时间线 */
  html.push(`<div class="sec"><h5>事件时间线</h5><div class="tl">
    ${d.events.map(e => {
      const stc = EV_STATUS[e.event] ? ST[EV_STATUS[e.event]].c : 'var(--st-draft)';
      return `<div class="ev" style="--c:${stc}"><span class="pt"></span>
        <div class="l1"><span class="nm">${EV_ZH[e.event]||e.event}</span>
          <span class="chip">${e.actor==='user'?'user':e.actor}</span></div>
        <div class="meta2 mono">#${e.seq} · ${e.ts}</div>
        ${e.pay?`<div class="pay">${esc(e.pay)}</div>`:''}
      </div>`;}).join('')}
    </div>
    ${d.total>d.events.length?`<div class="more">共 ${d.total} 条,显示最近 ${d.events.length} 条 ·
      <button class="copy" onclick="copyText(this,'sigmarun events ${r.run.run_id} --task=${t.task_id} --limit=0')">复制完整命令</button></div>`:''}
  </div>`);
  el.innerHTML = html.join('');
}

/* 边详情卡:点边 → 关系视图(kind、端点、闸门判定 / refs 清单) */
function renderEdgeCard(el, r, e){
  const k = EDGE_ZH[e.kind] || { zh:e.kind, note:'' };
  const fromSt = ((r.graph.nodes||[]).find(n => n.task_id === e.from) || {}).status;
  const met = fromSt === 'done' || fromSt === 'integrated';
  const kc = e.kind==='produces_context_for' ? 'var(--st-review)'
    : e.kind==='blocks' ? (met ? 'var(--st-approved)' : 'var(--st-ready)') : 'var(--edge)';
  let body = '';
  if (e.kind === 'blocks'){
    body = `<div class="kv"><b>闸门</b><div class="v">上游 done 前,下游不可被 claim-next 领取(required=${e.required!==false})</div></div>
      <div class="kv"><b>判定</b><div class="v">${met
        ? `<span style="color:var(--st-approved);font-weight:650">已满足</span> —— 上游 ${e.from} 已「${(ST[fromSt]||ST.unknown).zh}」`
        : `<span style="color:var(--st-ready);font-weight:650">未满足</span> —— 上游 ${e.from} 还在「${(ST[fromSt]||ST.unknown).zh}」,${e.to} 因此不可领`}</div></div>`;
  } else if (e.kind === 'produces_context_for'){
    body = `<div class="kv"><b>refs</b><div class="v">${(e.refs_list||[]).map(x => `<div class="refline"><code>${esc(x)}</code></div>`).join('') || '—'}</div></div>
      <div class="kv"><b>hydrate</b><div class="v">下游认领时,上述 refs 作为 must_read 注入(context_ack 对账为演进项)</div></div>`;
  }
  el.innerHTML = `<div class="edgehead">
      <div class="l1"><b class="mono" style="font-size:13px">${e.edge_id||'边'}</b>
        <span class="pill" style="--c:${kc}">${k.zh}</span>
        <button class="copy" style="margin-left:auto" onclick="selEdge=null;renderAll()">✕ 关闭</button></div>
      <div class="l1" style="margin-top:8px">
        <span class="chip click" onclick="selectNode('${e.from}')">${e.from}</span><span class="earrow">→</span>
        <span class="chip click" onclick="selectNode('${e.to}')">${e.to}</span></div>
    </div>
    <div class="sec"><h5>关系</h5>${body}
      <div class="kv"><b>说明</b><div class="v">${k.note}</div></div></div>`;
}

/* ================= 主题 / 复制 / 汇总 ================= */
const THEMES = ['auto','light','dark'];
function applyTheme(t){
  if (t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = '主题:' + ({auto:'自动',light:'亮',dark:'暗'}[t]);
  try{ localStorage.setItem('sigmarun-mock-theme', t); }catch(e){}
}
function cycleTheme(){
  const cur = (()=>{try{return localStorage.getItem('sigmarun-mock-theme')}catch(e){return null}})() || 'auto';
  applyTheme(THEMES[(THEMES.indexOf(cur)+1) % THEMES.length]);
}
function copyText(btn, text){
  const done = () => { const old = btn.textContent; btn.textContent = '已复制';
    setTimeout(()=>btn.textContent = old, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done();
}
function renderAll(){
  renderInbox(); renderRuns(); renderAgents(); renderPane();
  renderDag(); renderTable(); renderSidebar();
}
applyTheme((()=>{try{return localStorage.getItem('sigmarun-mock-theme')}catch(e){return null}})() || 'auto');
renderAll();
</script>
</body>
